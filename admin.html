<!-- Output: html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理者ページ｜ナレッジ管理</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container admin">
    <header>
      <h1>管理者ページ</h1>
      <p class="note">ナレッジの追加・ユーザー質問の確定・蓄積ナレッジの管理・回答品質の改善を行います</p>
    </header>

    <!-- ログイン -->
    <section id="login-section" class="card">
      <h2>ログイン</h2>
      <input type="password" id="admin-pass" placeholder="管理パスワード" />
      <button id="login-btn">ログイン</button>
      <p id="login-msg" class="warning"></p>
    </section>

    <!-- 管理パネル（ログイン後表示） -->
    <div id="panel" style="display:none;">

      <!-- 統計ダッシュボード -->
      <section class="card">
        <h2>状況サマリー（Closed Loop 指標）</h2>
        <div id="stats-grid" class="stats-grid">
          <p class="note">読み込み中...</p>
        </div>
      </section>

      <!-- タブ切り替え -->
      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="tab-add">① ナレッジ追加</button>
        <button type="button" class="tab-btn" data-tab="tab-pending">② 確定待ち質問</button>
        <button type="button" class="tab-btn" data-tab="tab-list">③ ナレッジ一覧</button>
        <button type="button" class="tab-btn" data-tab="tab-lowrated">④ 改善対象（👎）</button>
      </div>

      <!-- ① ナレッジ自由記述追加 -->
      <section class="card tab-content" id="tab-add">
        <h2>ナレッジを追加（自由記述）</h2>
        <p class="note">カテゴリ分けは不要です。AIが自動で分類・整理します。</p>
        <textarea id="kn-text" rows="5" placeholder="例：返品対応は購入後14日以内、レシート必須。送料は当社負担。"></textarea>
        <button id="kn-add">ナレッジとして登録</button>
        <p id="kn-msg" class="info-msg"></p>
      </section>

      <!-- ② ユーザー質問ログ → 回答確定 -->
      <section class="card tab-content" id="tab-pending" style="display:none;">
        <h2>ユーザー質問ログ（確定待ち）</h2>
        <div class="toolbar-row">
          <button id="pending-reload">最新を読み込む</button>
          <input type="text" id="pending-search" class="search-bar" placeholder="質問文で検索..." />
          <select id="pending-filter" class="filter-select">
            <option value="">すべてのカテゴリ</option>
            <option value="業務">業務</option>
            <option value="商品サービス">商品サービス</option>
            <option value="販売方法">販売方法</option>
            <option value="利益計算">利益計算</option>
            <option value="人事評価">人事評価</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div id="pending-list" class="list"></div>
      </section>

      <!-- ③ 蓄積ナレッジ一覧 -->
      <section class="card tab-content" id="tab-list" style="display:none;">
        <h2>蓄積ナレッジ一覧</h2>
        <div class="toolbar-row">
          <button id="kn-reload">一覧を読み込む</button>
          <input type="text" id="kn-search" class="search-bar" placeholder="キーワードで検索..." />
          <select id="kn-filter" class="filter-select">
            <option value="">すべてのカテゴリ</option>
            <option value="業務">業務</option>
            <option value="商品サービス">商品サービス</option>
            <option value="販売方法">販売方法</option>
            <option value="利益計算">利益計算</option>
            <option value="人事評価">人事評価</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div id="kn-list" class="list"></div>
      </section>

      <!-- ④ 改善対象（低評価👎の回答） -->
      <section class="card tab-content" id="tab-lowrated" style="display:none;">
        <h2>改善対象：役に立たなかった回答（👎）</h2>
        <p class="note">
          ここに集まった回答を改善して「改善済みナレッジ」に登録すると、
          次回以降のAIが同じ失敗を避けて回答するようになります（学習ループ）。
        </p>
        <div class="toolbar-row">
          <button id="lowrated-reload">最新を読み込む</button>
          <input type="text" id="lowrated-search" class="search-bar" placeholder="質問文で検索..." />
          <select id="lowrated-filter" class="filter-select">
            <option value="">すべての状態</option>
            <option value="open">未対応のみ</option>
            <option value="resolved">改善済みのみ</option>
          </select>
        </div>
        <div id="lowrated-list" class="list"></div>
      </section>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
